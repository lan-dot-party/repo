tag      = '^v?\d+\.\d+\.\d+$'
build    = "generic"
deb      = '^discord-gameserver-notifier_.+_all\.deb$'
rpm      = '^discord-gameserver-notifier-.+\.noarch\.rpm$'
arch     = '^discord-gameserver-notifier-.+-any\.pkg\.tar\.zst$'
# kein apk

